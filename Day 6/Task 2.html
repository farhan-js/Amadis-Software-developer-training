<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Object Model Practice</title>
</head>
<body>
    <h3>getElementsByClassName Example with innerHtml</h3>
    <p class="demo1" id="demo"></p>
    <hr>
    <h3>getElementById Example with innerHtml</h3>
    <p id="sample"></p>
    <hr>
    <h3>getElementsByTagName Example with innerHtml</h3>
    <div></div>
    <h3>querySelector Example with style</h3>
    <p id="query">Hello </p>

    <h1 id="change">innerHTML tag changing of h3</h1>
    <div id="inner" >
        <p>Hello</p>
        <p style="display:none">Welcome to</p>
        <b>JavaScript</b>
    </div>
</body>
    <script>
        let content1=document.getElementsByClassName("demo1");
        content1[0].innerHTML="Content modified";
        console.log(content1)

        let content2=document.getElementById("sample");
        content2.innerHTML="Content modified";
        console.log(content2)

        let content3=document.getElementsByTagName("div");
        content3[0].innerHTML="Content modified";
        console.log(content3)

        let content4=document.querySelector("#query");
        content4.style.color="blue";
        console.log(content4)

        let content5=document.querySelectorAll("h3");
        for(let i=0;i<content5.length;i++){
        content5[i].style.color="red";
        }
        console.log(content5);

        let change1=document.getElementById("change");
        change1.innerHTML="<p>innerHTML tag changing from h3 to paragraph</p>"
        console.log(change1);

        console.log(document.getElementById("inner").innerHTML);
        console.log(document.getElementById("inner").innerText);
        console.log(document.getElementById("inner").textContent);
    </script>
</body>
</html>
